# authentik blueprint: the identity provider's side of ADR 0029, as code.
# Mounted into the authentik worker by docker-compose.idp.yml and applied at startup.
#
# It creates, for the gateway:
#   - an OAuth2/OIDC provider that signs access tokens with RS256 (the gateway verifies
#     them against this provider's JWKS);
#   - a SCIM provider that pushes users and groups to the gateway's /scim/v2;
#   - one application that ties the two together.
#
# Users and groups are not created here: they are the directory's content, managed in
# authentik (UI or API) and pushed to the gateway as they change.
version: 1
metadata:
  name: AI Gateway - OIDC application and SCIM provisioning
entries:
  # The flows, scope mappings and SCIM mappings below ship with authentik; make sure
  # their blueprints are applied before this one looks them up.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: { name: "Default - Provider authorization flow (implicit consent)" }
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: { name: "Default - Provider invalidation flow" }
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: { name: "System - OAuth2 Provider - Scopes" }
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: { name: "System - SCIM Provider - Mappings" }
      required: true

  - model: authentik_providers_oauth2.oauth2provider
    id: oidc
    identifiers:
      name: ai-gateway
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: ai-gateway   # also the tokens' `aud`: the gateway's OIDC_AUDIENCE
      client_secret: !Env GATEWAY_OIDC_CLIENT_SECRET
      # Without a signing key authentik signs with the client secret (HS256), which the
      # gateway refuses: it accepts asymmetric signatures only.
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Scripts and CLIs get a token with the client-credentials grant (a user's app
      # password, or the client secret). No browser sign-in is set up, so no redirect URIs.
      grant_types: [client_credentials]
      redirect_uris: []
      access_token_validity: minutes=10
      # `sub` is the user's hashed id, the same value the SCIM provider sends as
      # `externalId`. That is the join between a token and a provisioned user.
      sub_mode: hashed_user_id
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]

  - model: authentik_providers_scim.scimprovider
    id: scim
    identifiers:
      name: ai-gateway-scim
    attrs:
      url: http://gateway:8000/scim/v2
      token: !Env SCIM_TOKEN
      verify_certificates: false   # plain HTTP on the compose network
      exclude_users_service_account: true
      property_mappings:
        - !Find [authentik_providers_scim.scimmapping, [managed, goauthentik.io/providers/scim/user]]
      property_mappings_group:
        - !Find [authentik_providers_scim.scimmapping, [managed, goauthentik.io/providers/scim/group]]

  - model: authentik_core.application
    identifiers:
      slug: ai-gateway
    attrs:
      name: AI Gateway
      provider: !KeyOf oidc
      backchannel_providers:
        - !KeyOf scim
